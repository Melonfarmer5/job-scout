name: Job Scout

on:
  schedule:
    # 6:17am, 12:17pm and 6:17pm New York time (UTC shown; shifts one hour in summer)
    - cron: "17 11,17,23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scout
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python test_scout.py
      - name: Scan company job feeds
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python scout.py
      - name: Save results
        run: |
          git config user.name "job-scout-bot"
          git config user.email "job-scout-bot@users.noreply.github.com"
          git add docs data
          git diff --cached --quiet || git commit -m "Scan $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
